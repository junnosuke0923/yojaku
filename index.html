<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#35664e" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!--
      ホーム画面に置いて、アプリのように開けるようにする（依頼者の案・2026-09-02）。
      住所は相対にしてある。GitHub Pages の /yojaku/ 配下でも、
      根に置いたときでも、同じものがそのまま動く
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Android は「ホーム画面に追加しますか」を出せる状態になると、
      `beforeinstallprompt` という知らせを一度だけ投げてくる。
      これを受け取っておかないと、あとから自分のボタンで呼び出せない。

      画面が組み上がる前に飛んでくることがあるので、**ここで受け取る**。
      React の中で待ち構えるだけでは、間に合わないことがある
      （依頼者の指示・2026-09-13、ホーム画面への追加を勧めるボタン）
    -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        // 端末まかせの帯を止めて、こちらのボタンから出す
        e.preventDefault()
        window.__yojakuInstall = e
        window.dispatchEvent(new Event('yojaku:installable'))
      })
      window.addEventListener('appinstalled', function () {
        window.__yojakuInstall = null
      })
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>要尺シミュレーター</title>
    <script type="module" crossorigin src="./assets/index-CQKlu9pu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B2jwY45Z.css">
  </head>

  </body>
